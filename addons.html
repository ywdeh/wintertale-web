<!doctype html>

        <link href="https://fonts.googleapis.com/css2?family=Gabriela&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        <link rel="preload" as="image" href="assets/background.jpg">
        <link rel="preload" as="image" href="assets/extra_background.jpg">
        <style>
            @keyframes fly {
            0%   { transform: translate(0,0); }
            40%  { transform: translate(30px,-40px); }
            70%  { transform: translate(-20px,-10px); }
            100% { transform: translate(10px,20px); }
            }

            @keyframes blink {
            0%,100% { opacity: 0; }
            50%     { opacity: 1; }
            }

            @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
            }

            .fade-in {
            opacity: 0;
            animation-fill-mode: forwards;
            animation-name: fadeIn;
            animation-duration: 0.4s;
            animation-timing-function: ease-in-out;
            }

            .pre-fade {
                opacity: 0;
            }

            #parallax {
            transition: background-position 0.25s ease-out;
            }

            ::-webkit-scrollbar {
            width: 9px;
            }

            ::-webkit-scrollbar-track {
            background: transparent;
            }

            ::-webkit-scrollbar-thumb {
            background: rgba(219, 234, 254, 0.15);
            border-radius: 32px;
            border: 2px solid transparent;
            background-clip: padding-box;
            }

            ::-webkit-scrollbar-thumb:hover {
            background: rgba(219, 234, 254, 0.25);
            }
        </style>
    </head>

        <audio id="hover-sound" src="assets/hover.mp3" preload="auto"></audio>
        <script>
        function copyIP() {
            navigator.clipboard.writeText("wt-de.hedwy.art");
            };

        window.addEventListener('load', () => {
        const elements = document.querySelectorAll('.with-fade');
        elements.forEach(el => {
            el.classList.remove('pre-fade');
            el.classList.add('fade-in');
            });
        });

        const parallaxSection = document.getElementById('parallax');
        window.addEventListener('mousemove', (e) => {
        if (!parallaxSection) return;
        const x = e.clientX / window.innerWidth;
        const y = e.clientY / window.innerHeight;
        const xOffset = (x - 0.5) * 20;
        const yOffset = (y - 0.5) * 20;
        parallaxSection.style.backgroundPosition = `calc(50% - ${xOffset}px) calc(50% - ${yOffset}px)`;
        });

        const hoverSound = document.getElementById("hover-sound");
        hoverSound.volume = 0.1;

        document.querySelectorAll("button, a").forEach(el => {
            el.addEventListener("click", () => {
                hoverSound.currentTime = 0;
                hoverSound.play();
            });
        });

        </script>
    </body>

</html>
