<!doctype html>
<html lang="en" class="selection:bg-blue-100/10 bg-[#0E1013]">

<head>
    <link rel="icon" href="/assets/downpour.ico">
    <title>{{ title }}</title>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Wintertale, спокойный сервер для комфортной игры">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="/scripts/scripts.js" defer></script>

    <link href="https://fonts.googleapis.com/css2?family=Gabriela&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="preload" as="image" href="/assets/background.jpg">
    <link rel="preload" as="image" href="/assets/extra_background.jpg">
    <style>
        @keyframes fly {
        0%   { transform: translate(0,0); }
        40%  { transform: translate(30px,-40px); }
        70%  { transform: translate(-20px,-10px); }
        100% { transform: translate(10px,20px); }
        }
        @keyframes blink {
        0%,100% { opacity: 0; }
        50%     { opacity: 1; }
        }
        @keyframes fadeIn {
        from {
            opacity: 0;
        }
        to {
            opacity: 1;
        }
        }
        .fade-in {
        opacity: 0;
        animation-fill-mode: forwards;
        animation-name: fadeIn;
        animation-duration: 0.4s;
        animation-timing-function: ease-in-out;
        }
        .pre-fade {
            opacity: 0;
        }
        #parallax {
        transition: background-position 0.25s ease-out;
        }

        ::-webkit-scrollbar {
        width: 9px;
        }
        ::-webkit-scrollbar-track {
        background: transparent;
        }
        ::-webkit-scrollbar-thumb {
        background: rgba(219, 234, 254, 0.15);
        border-radius: 32px;
        border: 2px solid transparent;
        background-clip: padding-box;
        }
        ::-webkit-scrollbar-thumb:hover {
        background: rgba(219, 234, 254, 0.25);
        }
    </style>
</head>

<body class="text-blue-50 text-md font-[Jost]">
  {{ content | safe }}

  <audio id="hover-sound" src="/assets/hover.mp3" preload="auto"></audio>
</body>

</html>
